
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Proyecto Web</title>
</head>
<body>
    <header>
        <h1>Bienvenido/a a mi sitio web</h1>

        <nav>
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#proyecto">Sobre el proyecto</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="inicio">
            <h2>Inicio</h2>
            <p>Este es un proyecto para aprender Git y GitHub.</p>
        </section>

        <section id="proyecto">
            <h2>Sobre el proyecto</h2>
            <p>Este sitio web forma parte de una práctica de Desarrollo de Aplicaciones Multiplataforma.</p>
        </section>

        <section id="contacto">
            <h2>Contacto</h2>
            <form>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="correo">Correo electrónico:</label>
    <input type="email" id="correo" name="correo" required>

    <label for="mensaje">Mensaje:</label>
    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

    <button type="submit">Enviar</button>
</form>
        </section>
    </main>
</body>
</html>
